name: Build Android APK (Hugh Development)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar manualmente clicando no botão no GitHub

jobs:
  build:
    name: Compilar APK na Nuvem (Zero RAM Local)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceitar Licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Executar Testes Unitarios
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: hugh-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
